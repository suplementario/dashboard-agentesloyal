<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loyal Insurance - Dashboard de Producción</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root {
            /* Verde azulado oscuro extraído del logo */
            --bg-loyal: #2c3e44; 
            --dorado-loyal: #d4af37;
            --blanco: #ffffff;
            --gris-cards: rgba(255, 255, 255, 0.95);
            --progreso-fill: #2196F3;
        }

        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background-color: var(--bg-loyal); 
            margin: 0; 
            padding: 20px; 
            color: #333; 
        }
        
        header { 
            display: flex; align-items: center; justify-content: center; flex-direction: column;
            padding: 10px; margin-bottom: 20px;
        }

        .logo-container img { height: 120px; margin-bottom: 10px; }

        /* Filtros (Sin Mes) */
        .filters { 
            display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); 
            gap: 15px; margin-bottom: 25px; background: rgba(0,0,0,0.3); padding: 15px; border-radius: 12px;
        }
        .filters div { display: flex; flex-direction: column; }
        label { font-size: 11px; font-weight: bold; margin-bottom: 5px; color: var(--dorado-loyal); text-transform: uppercase; }
        select { padding: 10px; border: none; border-radius: 6px; background: white; font-weight: 500; }

        /* Contenedor de Botones de Documentación (Claims & Brochure) */
        .doc-buttons-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }
        @media (max-width: 600px) {
            .doc-buttons-container { grid-template-columns: 1fr; gap: 12px; }
        }
        .btn-doc {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--dorado-loyal);
            color: var(--blanco);
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }
        .btn-doc:hover {
            background: var(--dorado-loyal);
            color: var(--bg-loyal);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
        }
        .btn-doc svg {
            margin-right: 10px;
            fill: currentColor;
        }

        /* Contenedor de Meta (Rectángulo Principal) */
        .meta-container {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 25px;
            border: 1px solid rgba(212, 175, 55, 0.4);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        .info-mes-grid {
            display: flex; justify-content: center; gap: 15px; margin-bottom: 15px;
        }
        .info-badge { background: var(--dorado-loyal); color: var(--bg-loyal); padding: 5px 15px; border-radius: 20px; font-weight: bold; font-size: 12px; text-transform: uppercase; }

        .countdown-grid { display: flex; justify-content: center; gap: 15px; margin: 20px 0; }
        .time-box {
            background: rgba(0,0,0,0.4); padding: 12px; border-radius: 10px; min-width: 80px;
            border: 1px solid var(--dorado-loyal);
        }
        .time-box span { display: block; font-size: 28px; font-weight: bold; color: var(--dorado-loyal); }
        .time-box label { color: white; font-size: 10px; text-transform: uppercase; opacity: 0.8; }

        /* Cuadros de productos (Debajo de la Meta) */
        .products-summary-grid {
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px; 
            margin-bottom: 40px;
        }
        .product-card {
            background: var(--blanco); border-radius: 15px; padding: 20px;
            text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }
        .product-card h4 { margin: 0; font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
        .product-card .prod-nap { font-size: 24px; font-weight: bold; color: #111; margin: 8px 0; }
        .product-card .prod-count { font-size: 12px; color: #555; font-weight: 600; }

        /* Sección Agentes */
        .agents-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
        }
        .agent-card {
            background: rgba(255,255,255,0.1); padding: 20px; border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.1); color: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .agent-name { font-size: 18px; font-weight: bold; color: var(--dorado-loyal); margin: 0; }
        .nap-val { font-size: 22px; font-weight: bold; color: white; }
        
        .progress-bar-container { background: rgba(255,255,255,0.2); height: 12px; border-radius: 6px; margin: 15px 0; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--progreso-fill); box-shadow: 0 0 10px var(--progreso-fill); transition: width 0.5s; }

        .section-title { color: var(--dorado-loyal); text-transform: uppercase; font-size: 14px; letter-spacing: 2px; border-left: 4px solid var(--dorado-loyal); padding-left: 10px; margin-bottom: 20px; }
        .status-msg { font-size: 12px; color: var(--dorado-loyal); text-align: center; margin-top: 5px; letter-spacing: 1px; }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="Logo Loyal-04.jpg" alt="Loyal Insurance Group">
        </div>
        <div id="status" class="status-msg">Sincronizando datos reales...</div>
    </header>

    <div class="filters">
        <div><label>Filtrar por Día</label><select id="selDia"><option value="TODOS">Todos los días</option></select></div>
        <div><label>Filtrar por Agente</label><select id="selAgente"><option value="TODOS">Todos los agentes</option></select></div>
        <div><label>Filtrar por Estatus</label><select id="selEstatus"><option value="TODOS">Todos los estatus</option></select></div>
        <div><label>Filtrar por Producto</label><select id="selProducto"><option value="TODOS">Todos los productos</option></select></div>
    </div>

    <div class="doc-buttons-container">
        <a href="https://drive.google.com/drive/folders/1QLCrmv_bvRl7NyVA0Qmt05Wh1pjHTKfi?usp=sharing" target="_blank" class="btn-doc">
            <svg width="20" height="20" viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
            Claims
        </a>
        <a href="https://drive.google.com/drive/folders/12Qy0I82LXyqkpwWFIyaM0_aNHaMw6Jjl?usp=sharing" target="_blank" class="btn-doc">
            <svg width="20" height="20" viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"/></svg>
            Brochure
        </a>
    </div>

    <div class="meta-container">
        <div class="info-mes-grid">
            <div class="info-badge">Periodo: Mayo 01 - 31, 2026</div>
            <div class="info-badge">Semanas del Mes: 5</div>
        </div>
        <h2 style="margin: 10px 0; font-size: 24px; color: var(--blanco);">Meta mensual: <span style="color:var(--dorado-loyal)">10,000 NAP</span> por agente</h2>
        <p style="margin: 0; font-size: 13px; opacity: 0.8; text-transform: uppercase; letter-spacing: 1px;">Tiempo restante para terminar el mes:</p>
        
        <div class="countdown-grid">
            <div class="time-box"><span id="days">00</span><label>Días</label></div>
            <div class="time-box"><span id="hours">00</span><label>Horas</label></div>
            <div class="time-box"><span id="mins">00</span><label>Minutos</label></div>
        </div>
    </div>

    <h3 class="section-title">Resumen de Producción por Producto</h3>
    <div id="productsGrid" class="products-summary-grid"></div>

    <h3 class="section-title">Ranking de Agentes</h3>
    <div id="agentsGrid" class="agents-grid"></div>

    <script>
        // Enlace definitivo a Google Sheets incorporado
        const URL_SHEET = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRcUbQrlcJO59VgI7NX68qkKZ7Ae6EZgwHK1Y5-CV-4svr9biR8xGqz6GljcM8VLQDWBv2UszNrqejG/pub?output=csv'; 
        const META_NAP = 10000;
        let dataGlobal = [];

        function updateCountdown() {
            const endDate = new Date("May 31, 2026 23:59:59").getTime();
            const now = new Date().getTime();
            const diff = endDate - now;
            if (diff > 0) {
                document.getElementById('days').innerText = Math.floor(diff / (1000 * 60 * 60 * 24)).toString().padStart(2, '0');
                document.getElementById('hours').innerText = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)).toString().padStart(2, '0');
                document.getElementById('mins').innerText = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60)).toString().padStart(2, '0');
            }
        }
        setInterval(updateCountdown, 1000);

        function init() {
            Papa.parse(URL_SHEET, {
                download: true, header: true, skipEmptyLines: true,
                complete: function(results) {
                    dataGlobal = results.data; 
                    document.getElementById('status').innerText = '● Producción Sincronizada';
                    setupFilters();
                    render();
                }
            });
        }

        function setupFilters() {
            const createOptions = (id, field) => {
                const vals = [...new Set(dataGlobal.map(d => d[field]))].filter(Boolean).sort();
                const sel = document.getElementById(id);
                sel.innerHTML = `<option value="TODOS">${sel.options[0].text}</option>`;
                vals.forEach(v => sel.innerHTML += `<option value="${v}">${v}</option>`);
                sel.addEventListener('change', render);
            };
            createOptions('selDia', 'FECHA DE EMISION');
            createOptions('selAgente', 'AGENTE');
            createOptions('selEstatus', 'ESTATUS');
            createOptions('selProducto', 'PRODUCTO');
        }

        function render() {
            const fAgente = document.getElementById('selAgente').value;
            const fEstatus = document.getElementById('selEstatus').value;
            const fProd = document.getElementById('selProducto').value;
            const fDia = document.getElementById('selDia').value;

            const filtered = dataGlobal.filter(d => {
                return (fAgente === 'TODOS' || d.AGENTE === fAgente) &&
                       (fEstatus === 'TODOS' || d.ESTATUS === fEstatus) &&
                       (fDia === 'TODOS' || d['FECHA DE EMISION'] === fDia) &&
                       (fProd === 'TODOS' || d.PRODUCTO === fProd);
            });

            renderProducts(filtered);
            renderAgents(filtered);
        }

        function renderProducts(data) {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';
            const prodSums = {};

            data.forEach(d => {
                if (d.PRODUCTO && d.PRODUCTO.trim() !== "" && d.PRODUCTO.toUpperCase() !== "OTROS") {
                    const p = d.PRODUCTO.trim().toUpperCase();
                    if (!prodSums[p]) prodSums[p] = { nap: 0, count: 0 };
                    prodSums[p].nap += parseFloat(d.NAP || 0);
                    prodSums[p].count++;
                }
            });

            Object.keys(prodSums).sort().forEach(p => {
                const info = prodSums[p];
                if (info.count > 0) {
                    grid.innerHTML += `
                        <div class="product-card">
                            <h4>${p}</h4>
                            <p class="prod-nap">${info.nap.toLocaleString(undefined, {minimumFractionDigits:2})}</p>
                            <p class="prod-count">${info.count} PÓLIZAS REGISTRADAS</p>
                        </div>`;
                }
            });
        }

        function renderAgents(data) {
            const grid = document.getElementById('agentsGrid');
            grid.innerHTML = '';
            const summary = {};

            data.forEach(d => {
                if (d.AGENTE) {
                    if (!summary[d.AGENTE]) summary[d.AGENTE] = { nap: 0, count: 0 };
                    summary[d.AGENTE].nap += parseFloat(d.NAP || 0);
                    summary[d.AGENTE].count++;
                }
            });

            Object.keys(summary).sort((a, b) => summary[b].nap - summary[a].nap).forEach(name => {
                const info = summary[name];
                const perc = Math.min((info.nap / META_NAP) * 100, 100).toFixed(1);
                grid.innerHTML += `
                    <div class="agent-card">
                        <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px;">
                            <div><p class="agent-name">${name}</p><small style="color:rgba(255,255,255,0.6)">${info.count} pólizas</small></div>
                            <div style="text-align:right">
                                <p class="nap-val">${info.nap.toLocaleString(undefined, {minimumFractionDigits:2})}</p>
                                <small style="color:var(--dorado-loyal)">Total NAP</small>
                            </div>
                        </div>
                        <div class="progress-bar-container"><div class="progress-fill" style="width: ${perc}%"></div></div>
                        <div style="display:flex; justify-content:space-between; font-size:11px; font-weight:bold;">
                            <span>${perc}% DE LA META</span>
                            <span style="opacity:0.7">META: ${META_NAP.toLocaleString()}</span>
                        </div>
                    </div>`;
            });
        }

        init();
        updateCountdown();
    </script>
</body>
</html>
